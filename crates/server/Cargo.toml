[package]
name = "voxt-server"
version.workspace = true
authors.workspace = true
repository.workspace = true
documentation.workspace = true
description.workspace = true
readme.workspace = true
license.workspace = true
keywords.workspace = true
edition.workspace = true
publish.workspace = true

default-run = "client"

[[bin]]
name = "client"
path = "src/client.rs"

[[bin]]
name = "server"
path = "src/server.rs"

[features]
default = ["server"]
server = ["dep:axum", "dep:tokio", "dep:tower-http"]

[dependencies]
anyhow = { version = "1.0.104" }
tracing = { version = "0.1.44" }
tracing-appender = { version = "0.2.5" }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
axum = { version = "0.8.9", features = ["tracing"], optional = true }
tokio = { version = "1.53.1", features = ["full"], optional = true }
tower-http = { version = "0.7.0", features = [
    "fs",
    "set-status",
    "timeout",
    "trace"
], optional = true }
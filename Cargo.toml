[workspace]
resolver = "3"
members = [
    "crates/voxt-client",
    "crates/voxt-core",
    "crates/voxt-server",
    "crates/voxt-world",
]
default-members = [
    "crates/voxt-client",
    "crates/voxt-core",
    "crates/voxt-server",
    "crates/voxt-world",
]

[workspace.package]
version = "0.1.0"
authors = ["fayefern <fayethefern@gmail.com>"]
repository = "https://github.com/fayefern/voxt"
documentation = "https://docs.rs/voxt"
description = "Vox<T> (voxt) is a large voxels game, made in rust."
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["game", "voxel", "native", "web"]
edition = "2024"
publish = false

[workspace.dependencies]
anyhow = { version = "1.0.104" }

[workspace.lints.rust]
unsafe_code = "forbid"
warnings = "deny"

[profile.release-native]
inherits = "release"
incremental = true
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.release-wasm]
inherits = "release"
incremental = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
[workspace]
resolver = "3"
members = [
    "crates/core-native",
    "crates/core-wasm",
    "crates/engine",
    "crates/game",
    "crates/server",
]

[workspace.package]
version = "0.1.0"
authors = ["fayefern <fayethefern@gmail.com>"]
repository = "https://github.com/fayefern/voxt"
documentation = "https://docs.rs/voxt"
description = "vox<T> (voxt) is a large voxels game, made in rust."
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["game", "voxel", "native", "web"]
edition = "2024"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
warnings = "deny"

[profile.release-native]
inherits = "release"
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.release-wasm]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true